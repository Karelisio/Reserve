name: Baseline profile

# Manual: records the startup and navigation code paths on an emulator and commits
# the resulting profile, which the next release build compiles ahead of time.
on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: SDK Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Activer KVM (émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v6

      - name: Générer le profil
        run: >
          ./gradlew :app:generateReleaseBaselineProfile
          -Pandroid.testoptions.manageddevices.emulator.gpu=swiftshader_indirect
          -Pandroid.experimental.testOptions.managedDevices.setupTimeoutMinutes=20

      - name: Commiter le profil
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/*/generated/baselineProfiles
          if git diff --cached --quiet; then echo "Profil inchangé."; exit 0; fi
          git commit -m "Baseline profile mis à jour"
          git push
