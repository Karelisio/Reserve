name: UI tests

# Instrumented smoke tests on an emulator: launch, every tab, settings.
# Separate from the "Android" workflow so that a flaky emulator never blocks a release.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app/**"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Tests instrumentés (émulateur)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: SDK Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - name: Activer KVM (émulateur)
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: gradle/actions/setup-gradle@v6

      # Built before the emulator starts: less time with both running.
      - name: Build APK et tests
        run: ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Tests instrumentés
        uses: reactivecircus/android-emulator-runner@v2.34.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew :app:connectedDebugAndroidTest

      - name: Rapports des tests
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: ui-test-reports
          path: |
            app/build/reports/androidTests/connected/
            app/build/outputs/androidTest-results/connected/
          if-no-files-found: ignore
