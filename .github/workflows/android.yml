name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests et build debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: SDK Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests unitaires
        run: ./gradlew :app:testDebugUnitTest
      - name: Build debug
        run: ./gradlew :app:assembleDebug

  release:
    name: APK release signé
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: SDK Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (voir README, section Signature)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reserve-release.jks"
          echo "RESERVE_KEYSTORE_PATH=$RUNNER_TEMP/reserve-release.jks" >> "$GITHUB_ENV"

      - name: Build release signé
        env:
          RESERVE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RESERVE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RESERVE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          RESERVE_VERSION_CODE: ${{ github.run_number }}
          RESERVE_VERSION_NAME: ${{ github.ref_type == 'tag' && github.ref_name || format('1.0.{0}', github.run_number) }}
        run: ./gradlew :app:assembleRelease

      - name: Vérifier la signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/reserve-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: reserve-${{ github.run_number }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: error
