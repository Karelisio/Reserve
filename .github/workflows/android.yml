name: Android

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Tests et build debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: SDK Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6
      - name: Tests unitaires (dont migration de la base)
        run: ./gradlew :app:testDebugUnitTest
      - name: Lint Android
        run: ./gradlew :app:lintDebug
      - name: Build debug
        run: ./gradlew :app:assembleDebug
      - name: Rapport lint
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html

  release:
    name: APK release signé
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v4
      - name: SDK Android 37
        run: sdkmanager "platforms;android-37.0" "build-tools;36.0.0"
      - uses: gradle/actions/setup-gradle@v6

      - name: Décoder le keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::Secret KEYSTORE_BASE64 manquant (voir README, section Signature)."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/reserve-release.jks"
          echo "RESERVE_KEYSTORE_PATH=$RUNNER_TEMP/reserve-release.jks" >> "$GITHUB_ENV"

      - name: Version
        run: |
          # versionCode always increases (run number): the app compares it to find updates.
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then NAME="${GITHUB_REF_NAME#v}"; else NAME="1.0.${GITHUB_RUN_NUMBER}"; fi
          echo "RESERVE_VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "RESERVE_VERSION_CODE=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"

      - name: Build release signé
        env:
          RESERVE_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          RESERVE_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          RESERVE_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Vérifier la signature
        run: |
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"
          for apk in app/build/outputs/apk/release/*.apk; do
            echo "== $apk"
            "$APKSIGNER" verify --print-certs "$apk" | head -3
          done

      - name: Supprimer le keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/reserve-release.jks"

      - name: Nommer les APK
        run: |
          # reserve-<versionName>-<versionCode>-<abi>.apk : format lu par la mise à jour intégrée.
          mkdir -p dist
          for apk in app/build/outputs/apk/release/app-*-release.apk; do
            abi=$(basename "$apk" | sed -E 's/^app-(.+)-release\.apk$/\1/')
            cp "$apk" "dist/reserve-${RESERVE_VERSION_NAME}-${RESERVE_VERSION_CODE}-${abi}.apk"
          done
          ls -la dist

      - uses: actions/upload-artifact@v7
        with:
          name: reserve-${{ env.RESERVE_VERSION_NAME }}
          path: dist/*.apk
          if-no-files-found: error

      - name: Publier la release GitHub
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then TAG="$GITHUB_REF_NAME"; else TAG="v${RESERVE_VERSION_NAME}"; fi
          git log -1 --pretty=format:%B | grep -vE '^(Co-Authored-By|Claude-Session):' > notes.md || true
          gh release create "$TAG" dist/*.apk \
            --title "Reserve ${RESERVE_VERSION_NAME}" \
            --notes-file notes.md \
            --target "$GITHUB_SHA" \
            --latest
